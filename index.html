<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Comercial - MegaGiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tom Select -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <!-- Style.css da pasta Layout -->
    <link rel="stylesheet" href="Layout/style.css">
</head>
<body>

    <!-- Recipiente do Cabeçalho -->
    <div id="header-container"></div>

    <!-- 1. TELA PRINCIPAL DE PEDIDO -->
    <div class="container" id="telaPrincipal">

        <div class="banner-gestao">
            <div>
                <div class="subtitulo-caixa-alta">Acompanhamento Estratégico</div>
                <h1>Pedido de Funcionário</h1>
            </div>
        </div>

        <div class="card-conteudo">
            <h3 style="margin-top:0; margin-bottom: 20px;">Cadastro de Pedido</h3>
            
            <form id="registroForm" class="grid-form">
                
                <div class="linha-funcionario">
                    <div class="campo-grupo">
                        <label for="nome">Funcionário</label>
                        <select id="nome" required placeholder="Digite para buscar o funcionário...">
                            <option value="">Carregando funcionários...</option>
                        </select>
                    </div>

                    <div class="campo-grupo">
                        <label for="fun_cod">Código do Funcionário</label>
                        <input type="text" id="fun_cod" placeholder="Código do Funcionário" readonly required>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label for="revenda">Revenda</label>
                    <select id="revenda" required>
                        <option value="">Selecione a Revenda</option>
                        <option value="CORONEL FABRICIANO">CORONEL FABRICIANO</option>
                        <option value="MANHUAÇU">MANHUAÇU</option> 
                        <option value="GOVERNADOR VALADARES">GOVERNADOR VALADARES</option>
                        <option value="TEOFILO OTONI">TEOFILO OTONI</option>  
                        <option value="ITAOBIM">ITAOBIM</option>   
                        <option value="JOÃO MONLEVADE">JOÃO MONLEVADE</option>                          
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="pagamento">Forma de Pagamento</label>
                    <select id="pagamento" required>
                        <option value="">Selecione a Forma de Pagamento</option>
                        <option value="PIX">PIX</option>
                        <option value="BOLETO">BOLETO</option>                         
                    </select>
                </div>

                <div class="campo-grupo campo-full">
                    <label for="produto">Produto</label>
                    <select id="produto" required placeholder="Digite para buscar o produto...">
                        <option value="">Carregando produtos...</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="prod_cod">Código do Produto</label>
                    <input type="text" id="prod_cod" placeholder="Código do Produto (Cod_prod)" readonly required>
                </div>

                <div class="campo-grupo">
                    <label for="qtd_cx">Qtd. por Caixa</label>
                    <input type="text" id="qtd_cx" placeholder="Quantidade por Caixa (QTD)" readonly required>
                </div>

                <div class="campo-grupo">
                    <label for="val_cx">Valor por Caixa</label>
                    <input type="text" id="val_cx" placeholder="Valor por Caixa (Val_cx)" readonly required>
                </div>

                <div class="campo-grupo">
                    <label for="val_uni">Valor Unitário</label>
                    <input type="text" id="val_uni" placeholder="Valor Unitário (val_uni)" readonly required>
                </div>
                
                <div class="container-botao">
                    <button type="submit" class="btn-salvar">Selecionar Produto</button>
                </div>
            </form>

            <h3 style="margin-top: 32px;">Finalização de pedido</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cód. Func.</th>
                            <th>Revenda</th>
                            <th>Forma de Pagamento</th>
                            <th>Cód. Produto</th>
                            <th>Descrição do Produto</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th style="width: 50px; text-align: center;"></th>
                        </tr>
                    </thead>
                    <tbody id="tabelaFinalizacao">
                        <tr id="linhaVazia">
                            <td colspan="8" style="text-align: center; color: #94a3b8; padding: 24px;">Nenhum produto selecionado. Preencha os campos acima e clique em "Selecionar Produto".</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="container-botao" style="margin-top: 28px;">
                <button type="button" id="btnFinalizarGeral" class="btn-finalizar-geral" onclick="finalizarPedidoGeral()">Finalizar o pedido</button>
            </div>
        </div>

    </div>

    <!-- 2. MODAL DE LOGIN -->
    <div class="modal-overlay" id="modalAdmin">
        <div class="modal-container">
            <button type="button" class="btn-voltar" onclick="fecharModalLogin()">← Voltar ao pedido</button>

            <div class="banner-gestao" style="margin-bottom: 16px;">
                <div>
                    <div class="subtitulo-caixa-alta">Acesso Restrito</div>
                    <h1 style="font-size: 26px;">Autenticação</h1>
                </div>
            </div>

            <div class="card-conteudo">
                <form id="formLoginAdmin" style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 0;">
                    <div>
                        <label style="font-size: 13px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">Usuário ou E-mail</label>
                        <input type="text" id="adminUsuario" placeholder="Digite seu usuário ou email" required>
                    </div>

                    <div>
                        <label style="font-size: 13px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">Senha</label>
                        <input type="password" id="adminSenha" placeholder="Digite sua senha" required>
                    </div>

                    <div style="margin-top: 8px;">
                        <button type="submit" id="btnEntrarAdmin" class="btn-salvar" style="width: 100%;">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Recipiente do Rodapé -->
    <div id="footer-container"></div>

    <script>
        async function carregarLayout() {
            try {
                const headerRes = await fetch('Layout/Cabecalho/header.html');
                if (headerRes.ok) {
                    document.getElementById('header-container').innerHTML = await headerRes.text();
                    
                    const nomeUsuario = localStorage.getItem('usuarioLogado');
                    if (nomeUsuario) {
                        renderizarHeaderUsuario(nomeUsuario);
                    }
                }

                const footerRes = await fetch('Layout/Rodape/footer.html');
                if (footerRes.ok) {
                    document.getElementById('footer-container').innerHTML = await footerRes.text();
                }
            } catch (err) {
                console.error('Erro ao carregar componentes de layout:', err);
            }
        }
        carregarLayout();

        function renderizarHeaderUsuario(nome) {
            const container = document.getElementById('headerUserInfo');
            if (container) {
                container.innerHTML = `
                    <span class="user-name" style="color: #ffffff; font-weight: 600; margin-right: 12px;">
                        <i class="fa-regular fa-user"></i> ${nome}
                    </span>
                    <button onclick="fazerLogout()" class="btn-logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                `;
            }
        }

        function fazerLogout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html';
        }

        const API_BASE_URL = window.location.origin;
        const API_REGISTROS = `${API_BASE_URL}/api/registros`;
        const API_FUNCIONARIOS = `${API_BASE_URL}/api/funcionarios`;
        const API_PRODUTOS = `${API_BASE_URL}/api/produtos`;
        const API_LOGIN = `${API_BASE_URL}/api/login`;

        let funcionariosDB = [];
        let produtosDB = [];
        let tomSelectFuncionario = null;
        let tomSelectProduto = null;
        let itensSelecionados = [];
        let contadorItens = 0;

        function abrirModalLogin() {
            document.getElementById('modalAdmin').style.display = 'flex';
        }

        function fecharModalLogin() {
            document.getElementById('modalAdmin').style.display = 'none';
            document.getElementById('formLoginAdmin').reset();
        }

        document.getElementById('formLoginAdmin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('adminUsuario').value;
            const senha = document.getElementById('adminSenha').value;
            const btn = document.getElementById('btnEntrarAdmin');

            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch(API_LOGIN, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erro de autenticação.');

                const nomeUsuario = data.user.Nome_User || usuario;
                localStorage.setItem('usuarioLogado', nomeUsuario);

                fecharModalLogin();
                window.location.href = 'relatorio.html';

            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        async function inicializarFuncionarios() {
            try {
                const res = await fetch(API_FUNCIONARIOS);
                funcionariosDB = await res.json();

                const selectNome = document.getElementById('nome');
                selectNome.innerHTML = '<option value="">Digite para buscar o funcionário...</option>';
                
                funcionariosDB.forEach(f => {
                    const option = document.createElement('option');
                    option.value = f.nome;
                    option.textContent = f.nome;
                    selectNome.appendChild(option);
                });

                if (tomSelectFuncionario) tomSelectFuncionario.destroy();

                tomSelectFuncionario = new TomSelect('#nome', {
                    create: false,
                    maxOptions: null,
                    sortField: { field: "text", direction: "asc" },
                    onChange: function(value) {
                        const funcionario = funcionariosDB.find(f => f.nome === value);
                        document.getElementById('fun_cod').value = funcionario ? funcionario.fun_cod : '';
                    }
                });
            } catch (error) {
                console.error('Erro ao carregar funcionários:', error);
            }
        }

        async function inicializarProdutos() {
            try {
                const res = await fetch(API_PRODUTOS);
                if (!res.ok) throw new Error('Erro na resposta do servidor');
                
                produtosDB = await res.json();

                const selectProduto = document.getElementById('produto');
                selectProduto.innerHTML = '<option value="">Digite para buscar o produto...</option>';
                
                produtosDB.forEach(p => {
                    if (p.produto) {
                        const option = document.createElement('option');
                        option.value = p.produto;
                        option.textContent = p.produto;
                        selectProduto.appendChild(option);
                    }
                });

                if (tomSelectProduto) tomSelectProduto.destroy();

                tomSelectProduto = new TomSelect('#produto', {
                    create: false,
                    maxOptions: null,
                    sortField: { field: "text", direction: "asc" },
                    onChange: function(value) {
                        const prod = produtosDB.find(p => p.produto === value);
                        
                        document.getElementById('prod_cod').value = prod ? (prod.prod_cod || '') : '';
                        document.getElementById('qtd_cx').value = prod ? (prod.qtd_cx || '') : '';
                        document.getElementById('val_cx').value = prod ? (prod.val_cx || '') : '';
                        document.getElementById('val_uni').value = prod ? (prod.val_uni || '') : '';
                    }
                });
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
            }
        }

        document.getElementById('registroForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const fun_cod = document.getElementById('fun_cod').value;
            const nome = document.getElementById('nome').value;
            const revenda = document.getElementById('revenda').value;
            const pagamento = document.getElementById('pagamento').value;
            const produto = document.getElementById('produto').value;
            const prod_cod = document.getElementById('prod_cod').value;
            const val_cx = document.getElementById('val_cx').value;
            const val_uni = document.getElementById('val_uni').value;

            if (!nome || !produto) {
                alert('Por favor, selecione um funcionário e um produto.');
                return;
            }

            const linhaVazia = document.getElementById('linhaVazia');
            if (linhaVazia) linhaVazia.remove();

            contadorItens++;
            const idLinha = `item_${contadorItens}`;

            const item = {
                idLinha,
                contador: contadorItens,
                nome,
                fun_cod,
                revenda,
                pagamento,
                produto,
                prod_cod,
                val_cx,
                val_uni
            };

            itensSelecionados.push(item);

            const tbody = document.getElementById('tabelaFinalizacao');
            const tr = document.createElement('tr');
            tr.id = idLinha;

            tr.innerHTML = `
                <td><strong>${fun_cod}</strong></td>
                <td>${revenda}</td>
                <td>${pagamento}</td>
                <td><strong>${prod_cod}</strong></td>
                <td>${produto}</td>
                <td>
                    <select class="select-tipo" id="tipo_${contadorItens}">
                        <option value="Caixa">Caixa</option>
                        <option value="Unidade">Unidade</option>
                    </select>
                </td>
                <td>
                    <input type="number" class="input-qtd" id="qtd_${contadorItens}" min="1" max="999" maxlength="3" value="1" oninput="if(this.value.length > 3) this.value = this.value.slice(0, 3);">
                </td>
                <td style="text-align: center;">
                    <button type="button" class="btn-remover" title="Remover item" onclick="removerLinha('${idLinha}')">✕</button>
                </td>
            `;

            tbody.appendChild(tr);

            if (tomSelectProduto) tomSelectProduto.clear();
            document.getElementById('prod_cod').value = '';
            document.getElementById('qtd_cx').value = '';
            document.getElementById('val_cx').value = '';
            document.getElementById('val_uni').value = '';
        });

        function removerLinha(idLinha) {
            const tr = document.getElementById(idLinha);
            if (tr) tr.remove();

            itensSelecionados = itensSelecionados.filter(i => i.idLinha !== idLinha);

            const tbody = document.getElementById('tabelaFinalizacao');
            if (tbody.children.length === 0) {
                tbody.innerHTML = `
                    <tr id="linhaVazia">
                        <td colspan="8" style="text-align: center; color: #94a3b8; padding: 24px;">Nenhum produto selecionado. Preencha os campos acima e clique em "Selecionar Produto".</td>
                    </tr>
                `;
            }
        }

        async function finalizarPedidoGeral() {
            if (itensSelecionados.length === 0) {
                alert('Adicione pelo menos um produto ao pedido antes de finalizar.');
                return;
            }

            const loteItens = [];

            for (const item of itensSelecionados) {
                const tipo = document.getElementById(`tipo_${item.contador}`).value;
                const qtd_pedido = parseInt(document.getElementById(`qtd_${item.contador}`).value, 10);

                if (!qtd_pedido || qtd_pedido <= 0) {
                    alert(`Por favor, informe uma quantidade válida para o produto: ${item.produto}`);
                    return;
                }

                let valorUnitarioOuCaixa = 0;
                let strVal = (tipo === 'Caixa' ? item.val_cx : item.val_uni) || '0';
                
                strVal = String(strVal).replace('R$', '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.').trim();
                valorUnitarioOuCaixa = parseFloat(strVal) || 0;

                const valPedTotal = Number((valorUnitarioOuCaixa * qtd_pedido).toFixed(2));

                loteItens.push({
                    Nome_Func: item.nome,
                    Cod_Func: item.fun_cod,
                    MG_Rev: item.revenda,
                    Form_Pag: item.pagamento,
                    Cod_Prod: item.prod_cod,
                    Tipo_Ped: tipo,
                    QTD_Ped: qtd_pedido,
                    Val_Ped: valPedTotal
                });
            }

            const btn = document.getElementById('btnFinalizarGeral');
            btn.disabled = true;
            btn.textContent = 'Enviando pedido...';

            try {
                const res = await fetch(API_REGISTROS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itens: loteItens })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Erro ao salvar o pedido no banco.');
                }

                const numPedFormatado = String(data.num_ped).padStart(6, '0');

                alert(`Sucesso! Pedido nº ${numPedFormatado} cadastrado com ${loteItens.length} item(ns).`);

                document.getElementById('registroForm').reset();
                if (tomSelectFuncionario) tomSelectFuncionario.clear();
                if (tomSelectProduto) tomSelectProduto.clear();

                itensSelecionados = [];
                const tbody = document.getElementById('tabelaFinalizacao');
                tbody.innerHTML = `
                    <tr id="linhaVazia">
                        <td colspan="8" style="text-align: center; color: #94a3b8; padding: 24px;">Nenhum produto selecionado. Preencha os campos acima e clique em "Selecionar Produto".</td>
                    </tr>
                `;
            } catch (error) {
                console.error(error);
                alert(`Erro ao gravar o pedido: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Finalizar o pedido';
            }
        }

        inicializarFuncionarios();
        inicializarProdutos();
    </script>
</body>
</html>
